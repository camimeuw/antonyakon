<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>otros proyectos ✦ antonia kon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="pagina">

    <div class="layout">
      <main class="col-centro">

        <div class="content-box">
          <p class="seccion-label">otros proyectos ✦</p>

          <div id="contenedor-proyectos" class="acordeon-container">
             <p style="text-align:center; color:#f9b8d9;">cargando proyectos mágicamente... ✿</p>
          </div>

          <a href="index.html" class="btn-volver" style="margin-top: 20px;">✦ volver al inicio ✦</a>

        </div>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2FJXWky5cLhA3MCA0K36xRaUm1C7Iq2j1FjNsCHE_ESsVFwYefIkLQBF8dIulQ44HduLpm7ZoLjHx/pub?output=csv";

    Papa.parse(urlCSV, {
      download: true,
      header: false,
      complete: function(resultados) {
        const filas = resultados.data.slice(1);
        const contenedor = document.getElementById('contenedor-proyectos');
        let htmlFinal = '';

        const agrupado = {};

        filas.forEach(fila => {
          if (fila.length >= 4 && fila[0]) {
            const categoriaPrincipal = fila[0].trim().toLowerCase();

            if (categoriaPrincipal === "otros proyectos") {
              const subcategoria = fila[1].trim();

              if (!agrupado[subcategoria]) {
                agrupado[subcategoria] = [];
              }
              agrupado[subcategoria].push(fila);
            }
          }
        });

        for (let subcat in agrupado) {
          htmlFinal += `
            <details class="acordeon">
              <summary class="acordeon-titulo">${subcat}</summary>
              <div class="acordeon-contenido">
          `;

          agrupado[subcat].forEach(link => {
            if (link[4]) {
              htmlFinal += `<p style="color: #664229; font-size: 0.95rem; margin-bottom: 5px;">${link[4]}</p>`;
            }
            htmlFinal += `<a href="${link[3]}" target="_blank" class="link-texto">${link[2]}</a>`;
          });

          htmlFinal += `
              </div>
            </details>
          `;
        }

        if (htmlFinal === '') {
          contenedor.innerHTML = '<p style="text-align:center; color:#664229;">Aún no hay proyectos subidos.</p>';
        } else {
          contenedor.innerHTML = htmlFinal;
        }
      }
    });
  </script>

</body>
</html>
